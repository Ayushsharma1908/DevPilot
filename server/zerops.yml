zerops:
  - setup: api
    build:
      base: alpine/nodejs@22
      buildCommands:
        - npm install
        - npm run build
      deployFiles:
        - dist
        - package.json
        - package-lock.json

    run:
      base: alpine/nodejs@22
      ports:
        - port: 8787
      start: npm install --omit=dev && npm start