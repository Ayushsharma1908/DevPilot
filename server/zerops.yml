zerops:
  - setup: api
    build:
      base: alpine/nodejs@22
      buildCommands:
        - npm install
        - npm run build
        - npm prune --omit=dev
      deployFiles:
        - dist
        - node_modules
        - package.json
        - package-lock.json
    run:
      base: alpine/nodejs@22
      ports:
        - port: 8787
          httpSupport: true
      start: node dist/index.js
